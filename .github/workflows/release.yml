name: Release

# Build and publish installers when a version tag (e.g. v0.1.1) is pushed.
# Actions are pinned to commit SHAs (with the human-readable tag in a comment)
# for supply-chain safety; Dependabot keeps these SHAs updated.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'          # universal .dmg (Apple Silicon + Intel)
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'        # .msi + .exe (NSIS)
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './app -> target'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm install
        working-directory: app

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'KEF Control ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform from the assets below.

            - Windows: the `*-setup.exe` (recommended) or the `*.msi`
            - macOS: the universal `.dmg` (runs on Apple Silicon and Intel)

            Both builds are unsigned, so the OS warns on first launch:

            - Windows: SmartScreen -> More info -> Run anyway.
            - macOS: it says it "could not verify" the app. Open System Settings ->
              Privacy & Security, scroll to Security, and click "Open Anyway".

            Full first-launch steps are in the README ("Opening on macOS").
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
