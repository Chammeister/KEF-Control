version: 2
updates:
  # Frontend npm dependencies - one combined PR per month
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"

  # Rust backend + kef-client crate (Cargo workspace at /app) - one combined PR
  - package-ecosystem: "cargo"
    directory: "/app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"

  # GitHub Actions (keeps the pinned SHAs current) - one combined PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
